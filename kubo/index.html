  <style>
    html,
    body {
      background: #050302;
    }

    #qr canvas,
    #qr img {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    #qr img {
      image-rendering: pixelated;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    .font-signature {
      font-family: 'Great Vibes', cursive;
    }

    .font-body {
      font-family: 'Spectral', serif;
    }

    #polvo-magico {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    #reflector {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 60% 45% at 50% 30%, rgba(212, 175, 55, .16), transparent 70%);
      opacity: 0;
      transition: opacity 1.1s ease;
    }

    #reflector.opacity-100 {
      opacity: 1;
    }

    /* ── Telón ─────────────────────────────────────────────────── */
    .telon {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 51%;
      z-index: 50;
      background:
        repeating-linear-gradient(100deg, rgba(255, 255, 255, .05) 0 10px, rgba(0, 0, 0, 0) 10px 26px),
        radial-gradient(ellipse at 50% 0%, #1c1305 0%, #0a0700 55%, #000 100%);
      box-shadow: inset 0 0 120px rgba(0, 0, 0, .85);
    }

    .telon::before {
      content: '';
      position: absolute;
      inset: 0 0 0 0;
      pointer-events: none;
      background: repeating-linear-gradient(90deg, rgba(212, 175, 55, .10) 0 3px, transparent 3px 34px);
      mix-blend-mode: overlay;
    }

    .telon::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 34px;
      background: linear-gradient(180deg, #b8860b, #e9c46a 40%, #8a6a12);
      clip-path: polygon(0 0, 100% 0, 100% 55%, 94% 100%, 88% 55%, 82% 100%, 76% 55%, 70% 100%, 64% 55%, 58% 100%, 52% 55%, 46% 100%, 40% 55%, 34% 100%, 28% 55%, 22% 100%, 16% 55%, 10% 100%, 4% 55%, 0 100%);
      box-shadow: 0 0 12px rgba(212, 175, 55, .5);
    }

    #telon-izq {
      left: 0;
      border-right: 2px solid rgba(212, 175, 55, .55);
    }

    #telon-der {
      right: 0;
      border-left: 2px solid rgba(212, 175, 55, .55);
    }

    @keyframes open-left {
      to {
        transform: translateX(-105%) skewY(-1.5deg);
      }
    }

    @keyframes open-right {
      to {
        transform: translateX(105%) skewY(1.5deg);
      }
    }

    .animate-open-left {
      animation: open-left 1.3s cubic-bezier(.65, 0, .35, 1) forwards;
    }

    .animate-open-right {
      animation: open-right 1.3s cubic-bezier(.65, 0, .35, 1) forwards;
    }

    @keyframes rise {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(.98);
      }

      100% {
        opacity: 1;
        transform: none;
      }
    }

    .animate-rise {
      animation: rise .9s cubic-bezier(.16, 1, .3, 1) both;
      animation-delay: .55s;
    }

    @keyframes letter-in {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(.8);
        filter: blur(3px);
      }

      60% {
        filter: blur(0);
      }

      100% {
        opacity: 1;
        transform: none;
      }
    }

    .animate-letter-in {
      animation: letter-in .5s ease-out forwards;
    }

    @keyframes halo-spin {
      to {
        transform: rotate(360deg);
      }
    }

    .animate-halo-spin {
      animation: halo-spin 6s linear infinite;
    }

    @keyframes shine {
      to {
        background-position: -200% 0;
      }
    }

    .animate-shine {
      animation: shine 1.4s linear infinite;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: .35;
      }

      50% {
        opacity: 1;
      }
    }

    .estrella-fija {
      animation: twinkle 2.6s ease-in-out infinite;
    }

    /* ── Chispas de los botones ───────────────────────────────────── */
    @keyframes chispa-destello {

      0%,
      100% {
        opacity: 0;
        transform: scale(.5);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-chispa {
      animation: chispa-destello 2s ease-in-out infinite;
    }

    @keyframes girar-lento {
      to {
        transform: rotate(360deg);
      }
    }

    .animate-girar-lento {
      animation: girar-lento 3s linear infinite;
    }
  </style>
  <script>

</head>
